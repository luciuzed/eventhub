<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTHUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="bg-white border-bottom py-3 sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-dark fs-4 m-0" href="#">EVENTHUB</a>
            <nav>
                <ul class="nav">
                    <li class="nav-item"><a class="nav-link text-secondary fw-medium" href="#beranda">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary fw-medium" href="#workshop">Workshop</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary fw-medium" href="#pendaftaran">Pendaftaran</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <section id="beranda" class="hero-section mb-5 py-4">
            <div class="hero-content">
                <h1 class="fw-bold mb-3 text-dark display-5">Selamat Datang di EVENTHUB</h1>
                <p class="lead text-muted mb-4">Pusat registrasi workshop informatika terbaik untuk meningkatkan skill pemrograman dan teknologi Anda.</p>
                <div class="hero-buttons">
                    <a href="#pendaftaran" class="btn btn-dark btn-lg px-4 me-2 mb-2">Daftar Sekarang</a>
                    <a href="#workshop" class="btn btn-outline-secondary btn-lg px-4 mb-2">Lihat Informasi</a>
                </div>
            </div>
            <div class="hero-image-wrapper">
                <img src="./images.png" class="img-fluid custom-banner-img border shadow-sm" alt="Banner Workshop">
            </div>
        </section>
    </main>
</body>
</html>
